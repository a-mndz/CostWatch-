services:
  costwatch:
    build: .
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - DATABASE_URL=${DATABASE_URL:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - costwatch-data:/app/data
    restart: unless-stopped

volumes:
  costwatch-data:
